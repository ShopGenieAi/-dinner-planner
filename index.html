<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Mark & Allie — Meal Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f2f5; --white:#ffffff; --border:rgba(0,0,0,0.09); --border2:rgba(0,0,0,0.14);
  --text:#111827; --muted:#6b7280; --dim:#9ca3af;
  --mark:#3b82f6; --allie:#ec4899;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,20px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* HEADER */
.hdr{position:sticky;top:0;z-index:200;padding:calc(var(--safe-t) + 14px) 18px 12px;background:rgba(240,242,245,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;}
.hdr-left h1{font-family:'Playfair Display',serif;font-size:21px;color:var(--text);letter-spacing:-.3px;}
.hdr-left p{font-size:11px;color:var(--muted);margin-top:1px;font-weight:400;}
.today-badge{padding:5px 12px;border-radius:100px;background:var(--white);border:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* MEAL TYPE TABS */
.tabs-outer{background:var(--white);border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tabs-outer::-webkit-scrollbar{display:none;}
.tabs-row{display:flex;min-width:max-content;}
.tab{flex:1;min-width:80px;padding:13px 10px 11px;text-align:center;cursor:pointer;border:none;background:none;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;position:relative;transition:color .2s;}
.tab.active{color:var(--text);}
.tab.active::after{content:'';position:absolute;bottom:-2px;left:20%;right:20%;height:2.5px;border-radius:2px;background:var(--text);}
.tab-icon{display:block;font-size:18px;margin-bottom:3px;}

/* DAY STRIP */
.days-outer{overflow-x:auto;scrollbar-width:none;padding:12px 16px 8px;}
.days-outer::-webkit-scrollbar{display:none;}
.days-row{display:flex;gap:8px;min-width:max-content;}
.day-btn{display:flex;flex-direction:column;align-items:center;padding:9px 13px;border-radius:14px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;transition:all .18s;font-family:'Outfit',sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.day-btn:active{transform:scale(.94);}
.day-short{font-size:12px;font-weight:700;color:#888;letter-spacing:.5px;text-transform:uppercase;}
.day-num{font-size:10px;font-weight:500;color:#bbb;margin-top:2px;}
.day-dot{width:4px;height:4px;border-radius:50%;margin-top:4px;background:transparent;transition:all .2s;}
.day-btn.today .day-short{color:var(--text);}
.day-btn.today .day-dot{background:#f97316;}
.day-btn.active{border-color:var(--text);background:var(--text);}
.day-btn.active .day-short{color:#fff;}
.day-btn.active .day-num{color:rgba(255,255,255,.5);}
.day-btn.active .day-dot{background:rgba(255,255,255,.6);}

/* MEAL PICKER CHIPS */
.picker-outer{padding:2px 16px 10px;display:none;}
.picker-scroll{overflow-x:auto;scrollbar-width:none;}
.picker-scroll::-webkit-scrollbar{display:none;}
.picker-row{display:flex;gap:7px;min-width:max-content;padding-bottom:2px;}
.meal-chip{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:100px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;transition:all .18s;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;color:#555;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.meal-chip:active{transform:scale(.95);}
.meal-chip.active{border-color:var(--text);background:var(--text);color:#fff;}
.meal-chip-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* MAIN */
.main{padding:0 14px calc(var(--safe-b) + 20px);}
.card-wrap{max-width:480px;margin:0 auto;}

/* HERO CARD */
.hero-card{border-radius:22px;overflow:hidden;border:1px solid var(--border2);background:var(--white);box-shadow:0 4px 24px rgba(0,0,0,.10);animation:cardIn .3s cubic-bezier(.2,0,.2,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}

/* IMAGE BANNER */
.meal-img-wrap{position:relative;height:180px;overflow:hidden;background:linear-gradient(135deg,#e5e7eb,#d1d5db);}
.meal-img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.meal-img-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.65) 100%);}
.meal-img-content{position:absolute;bottom:0;left:0;right:0;padding:14px 18px;}
.meal-tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;margin-bottom:7px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.9);backdrop-filter:blur(8px);}
.meal-title{font-family:'Playfair Display',serif;font-size:22px;line-height:1.15;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4);}
.meal-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px;font-weight:300;font-style:italic;}

/* CHEF TIP */
.cook-tip{padding:13px 18px;background:#fffbf0;border-bottom:1px solid #fde68a;display:flex;align-items:flex-start;gap:10px;}
.tip-icon{font-size:20px;flex-shrink:0;}
.tip-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:#92400e;margin-bottom:3px;}
.tip-body{font-size:13px;color:#78350f;font-weight:600;line-height:1.5;}

/* INGREDIENTS */
.ing-section{background:var(--white);}
.ing-hd{padding:12px 18px 6px;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#374151;font-weight:800;border-bottom:1px solid var(--border);}
.ing-row{padding:10px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.ing-name{flex:1;font-size:14px;color:#1f2937;line-height:1.35;font-weight:600;}
.ing-name strong{font-weight:800;}
.ing-only{display:block;font-size:10px;color:#9ca3af;margin-top:1px;font-weight:500;}
.ing-qty{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.qty{font-size:14px;font-weight:700;white-space:nowrap;}
.qty.m{color:var(--mark);}
.qty.a{color:var(--allie);}

/* RAW/COOKED */
.rc-wrap{margin:2px 14px 8px 16px;border-radius:0 12px 12px 0;border-left:3px solid #6b7280;background:#fafafa;overflow:hidden;}
.rc-head{padding:6px 14px 5px;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:#374151;}
.rc-row{padding:6px 14px 7px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(0,0,0,.05);}
.rc-who{font-size:12px;color:#555;font-weight:600;}
.rc-right{text-align:right;}
.rc-raw{font-size:13px;font-weight:800;display:block;}
.rc-raw.m{color:var(--mark);}
.rc-raw.a{color:var(--allie);}
.rc-cooked{font-size:12px;color:#555;display:block;font-weight:700;}
.sep{height:1px;background:#f3f4f6;margin:0 18px;}

/* TOTALS */
.totals-bar{padding:14px 14px 16px;background:#f9fafb;border-top:2px solid var(--border);}
.totals-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;color:#6b7280;margin-bottom:10px;padding:0 2px;}
.totals-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;width:100%;}
.tot{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:10px 6px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;position:relative;}
.tot-stripe{position:absolute;top:0;left:0;right:0;height:3px;}
.tot.mk .tot-stripe{background:linear-gradient(90deg,var(--mark),rgba(59,130,246,.2));}
.tot.al .tot-stripe{background:linear-gradient(90deg,var(--allie),rgba(236,72,153,.2));}
.tot-val{font-size:16px;font-weight:800;line-height:1;margin-top:2px;}
.tot-val.m{color:var(--mark);}
.tot-val.a{color:var(--allie);}
.tot-lbl{font-size:9px;color:#6b7280;margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;line-height:1.3;}

/* SNACK CARD — no image, different layout */
.snack-card{border-radius:22px;overflow:hidden;border:1px solid var(--border2);background:var(--white);box-shadow:0 4px 24px rgba(0,0,0,.10);animation:cardIn .3s cubic-bezier(.2,0,.2,1);}
.snack-header{padding:20px 18px 14px;background:linear-gradient(135deg,#fdf4ff,#fce7f3);border-bottom:1px solid rgba(236,72,153,.15);}
.snack-eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#be185d;margin-bottom:6px;}
.snack-title{font-family:'Playfair Display',serif;font-size:22px;line-height:1.15;color:#1f2937;}
.snack-sub{font-size:12px;color:#9ca3af;margin-top:4px;font-style:italic;}

/* EMPTY STATE */
.empty{text-align:center;padding:70px 30px;max-width:480px;margin:0 auto;}
.empty-icon{font-size:60px;display:block;margin-bottom:16px;}
.empty h2{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:8px;}
.empty p{font-size:14px;color:var(--muted);font-weight:400;line-height:1.6;}

/* DAILY SUMMARY STRIP */
.day-summary{background:var(--white);border:1px solid var(--border2);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.day-sum-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;}
.day-sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.day-sum-col{background:#f9fafb;border-radius:12px;padding:10px 12px;}
.day-sum-who{font-size:11px;font-weight:800;margin-bottom:6px;}
.day-sum-who.m{color:var(--mark);}
.day-sum-who.a{color:var(--allie);}
.day-sum-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;}
.day-sum-label{color:var(--muted);font-weight:500;}
.day-sum-val{font-weight:700;color:var(--text);}

.fn{text-align:center;padding:10px 0 4px;font-size:10px;color:#bbb;font-style:italic;max-width:480px;margin:0 auto;}
</style>
</head>

// ─── STATE ───────────────────────────────────────────────────────────────────
const TODAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
let curDay = null;
let curTab = 'breakfast';
let selections = {}; // {day: {breakfast: mealName, lunch, snack, dinner}}

function getSelection(day, tab) {
  if (!selections[day]) selections[day] = {};
  if (!selections[day][tab]) {
    const plan = PLAN[day][tab];
    if (tab === 'breakfast') return 'Oats & Chobani Bowl'; // Allie default shown; Mark shown separately
    return plan.def;
  }
  return selections[day][tab];
}

function setSelection(day, tab, meal) {
  if (!selections[day]) selections[day] = {};
  selections[day][tab] = meal;
}

// ─── BUILD UI ─────────────────────────────────────────────────────────────────
function buildDays() {
  const now = new Date();
  const dow = now.getDay();
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset);

  document.getElementById('daysRow').innerHTML = DAYS.map((d,i) => {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);
    return `<button class="day-btn${d===TODAY?' today':''}" onclick="pickDay('${d}')">
      <span class="day-short">${d.slice(0,3)}</span>
      <span class="day-num">${date.getDate()}</span>
      <span class="day-dot"></span>
    </button>`;
  }).join('');

  document.getElementById('todayBadge').textContent = TODAY;
}

function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (curDay) {
    buildPicker();
    buildCard();
  }
}

function pickDay(d) {
  curDay = d;
  document.querySelectorAll('.day-btn').forEach((el,i) => el.classList.toggle('active', DAYS[i]===d));
  document.querySelectorAll('.day-btn')[DAYS.indexOf(d)]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  buildPicker();
  buildCard();
}

function buildPicker() {
  const plan = PLAN[curDay][curTab];
  let opts = [];

  if (curTab === 'breakfast') {
    // Show Allie options as chips (Mark's smoothie is fixed)
    opts = PLAN[curDay].breakfast.allieOpts;
  } else if (curTab === 'summary') {
    document.getElementById('pickerOuter').style.display = 'none';
    return;
  } else {
    opts = plan.opts || [plan.def];
  }

  if (opts.length <= 1) {
    document.getElementById('pickerOuter').style.display = 'none';
    return;
  }

  document.getElementById('pickerOuter').style.display = 'block';
  const cur = getSelection(curDay, curTab);

  document.getElementById('pickerRow').innerHTML = opts.map(o => {
    const col = COLOURS[o] || '#888';
    const short = o.length > 26 ? o.split(' ').slice(0,3).join(' ')+'…' : o;
    const active = o === cur;
    return `<button class="meal-chip${active?' active':''}" onclick="pickMeal('${o.replace(/'/g,"\\'")}')">
      <span class="meal-chip-dot" style="background:${active?'rgba(255,255,255,0.8)':col}"></span>
      ${MEALS[curTab][o]?.e||''} ${short}
    </button>`;
  }).join('');
}

function pickMeal(meal) {
  setSelection(curDay, curTab, meal);
  buildPicker();
  buildCard();
}

// ─── CARD BUILDER ─────────────────────────────────────────────────────────────
function buildCard() {
  if (curTab === 'summary') { buildSummaryCard(); return; }

  // For breakfast, show both Mark's smoothie AND Allie's choice as two stacked cards
  if (curTab === 'breakfast') { buildBreakfastCard(); return; }

  const mealName = getSelection(curDay, curTab);
  const m = MEALS[curTab][mealName];
  if (!m) return;

  const col = COLOURS[mealName] || '#f97316';
  const img = IMGS[mealName] || '';

  document.getElementById('cardWrap').innerHTML =
    buildMealCardHTML(mealName, m, col, img) +
    '<div class="fn">Quantities match your spreadsheet ✦ Z</div>';
}

function buildBreakfastCard() {
  const markMeal = MEALS.breakfast['Smoothie (Mark)'];
  const allieMealName = getSelection(curDay, 'breakfast');
  const allieMeal = MEALS.breakfast[allieMealName];

  document.getElementById('pickerOuter').style.display = 'block';
  buildPicker();

  const markHTML = buildMealCardHTML('Smoothie (Mark)', markMeal, COLOURS['Smoothie (Mark)'], IMGS['Smoothie (Mark)']);
  const allieHTML = buildMealCardHTML(allieMealName, allieMeal, COLOURS[allieMealName], IMGS[allieMealName]);

  document.getElementById('cardWrap').innerHTML =
    `<div style="margin-bottom:12px">
      <div style="font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--mark);padding:0 4px 6px">💙 Mark's Breakfast</div>
      ${markHTML}
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--allie);padding:0 4px 6px">💗 Allie's Breakfast</div>
      ${allieHTML}
    </div>
    <div class="fn">Quantities match your spreadsheet ✦ Z</div>`;
}

function buildMealCardHTML(name, m, col, img) {
  let ings = '';
  m.ings.forEach((ing, i) => {
    if (i > 0) ings += '<div class="sep"></div>';
    if (ing.rc) {
      ings += `<div class="ing-row"><div class="ing-name"><strong>${ing.n}</strong></div></div>
        <div class="rc-wrap">
          <div class="rc-head">⚖ Weigh raw — serve as cooked</div>`;
      if (ing.mr) ings += `<div class="rc-row"><span class="rc-who">💙 Mark</span><div class="rc-right"><span class="rc-raw m">${ing.mr}</span><span class="rc-cooked">${ing.mc}</span></div></div>`;
      if (ing.ar) ings += `<div class="rc-row"><span class="rc-who">💗 Allie</span><div class="rc-right"><span class="rc-raw a">${ing.ar}</span><span class="rc-cooked">${ing.ac}</span></div></div>`;
      ings += `</div>`;
    } else {
      const tag = ing.mo ? `<span class="ing-only">💙 Mark only</span>`
                : ing.ao ? `<span class="ing-only">💗 Allie only</span>` : '';
      const mq = ing.m && !ing.ao ? `<span class="qty m">💙 ${ing.m}</span>` : '';
      const aq = ing.a && !ing.mo ? `<span class="qty a">💗 ${ing.a}</span>` : '';
      ings += `<div class="ing-row"><div class="ing-name">${ing.n}${tag}</div><div class="ing-qty">${mq}${aq}</div></div>`;
    }
  });

  const hasMark = m.mk > 0;
  const hasAllie = m.ak > 0;
  const totalsHTML = (hasMark || hasAllie) ? `
    <div class="totals-bar">
      <div class="totals-title">Nutrition</div>
      <div class="totals-grid">
        ${hasMark ? `<div class="tot mk"><div class="tot-stripe"></div><div class="tot-val m">~${m.mk}</div><div class="tot-lbl">💙 Mark<br>kcal</div></div>` : ''}
        ${hasAllie ? `<div class="tot al"><div class="tot-stripe"></div><div class="tot-val a">~${m.ak}</div><div class="tot-lbl">💗 Allie<br>kcal</div></div>` : ''}
        ${hasMark ? `<div class="tot mk"><div class="tot-stripe"></div><div class="tot-val m">${m.mp}g</div><div class="tot-lbl">💙 Mark<br>protein</div></div>` : ''}
        ${hasAllie ? `<div class="tot al"><div class="tot-stripe"></div><div class="tot-val a">${m.ap}g</div><div class="tot-lbl">💗 Allie<br>protein</div></div>` : ''}
      </div>
    </div>` : '';

  return `<div class="hero-card">
    <div class="meal-img-wrap">
      <img class="meal-img" src="${img}" alt="${name}" loading="lazy" onerror="this.style.display='none'">
      <div class="meal-img-overlay"></div>
      <div class="meal-img-content">
        <div class="meal-tag">🗓 ${m.tag}</div>
        <div class="meal-title">${name}</div>
        <div class="meal-sub">${m.sub}</div>
      </div>
    </div>
    <div class="cook-tip">
      <span class="tip-icon">${m.tip.icon}</span>
      <div><div class="tip-label">Tip</div><div class="tip-body">${m.tip.text}</div></div>
    </div>
    <div class="ing-section">
      <div class="ing-hd">Ingredients</div>
      ${ings}
    </div>
    ${totalsHTML}
  </div>`;
}

function buildSummaryCard() {
  if (!curDay) return;

  const bfMarkName = 'Smoothie (Mark)';
  const bfAllieName = getSelection(curDay, 'breakfast');
  const lunchName = getSelection(curDay, 'lunch');
  const snackName = getSelection(curDay, 'snack');
  const dinnerName = getSelection(curDay, 'dinner');

  const bfM = MEALS.breakfast[bfMarkName];
  const bfA = MEALS.breakfast[bfAllieName];
  const lunch = MEALS.lunch[lunchName];
  const snack = MEALS.snack[snackName];
  const dinner = MEALS.dinner[dinnerName];

  const mk_total = bfM.mk + lunch.mk + snack.mk + dinner.mk;
  const al_total = bfA.ak + lunch.ak + snack.ak + dinner.ak;
  const mk_prot  = bfM.mp + lunch.mp + snack.mp + dinner.mp;
  const al_prot  = bfA.ap + lunch.ap + snack.ap + dinner.ap;

  const rows = [
    {label:'Breakfast', mk_kcal: bfM.mk, al_kcal: bfA.ak, mk_p: bfM.mp, al_p: bfA.ap},
    {label:'Lunch',     mk_kcal: lunch.mk, al_kcal: lunch.ak, mk_p: lunch.mp, al_p: lunch.ap},
    {label:'Snack',     mk_kcal: snack.mk, al_kcal: snack.ak, mk_p: snack.mp, al_p: snack.ap},
    {label:'Dinner',    mk_kcal: dinner.mk, al_kcal: dinner.ak, mk_p: dinner.mp, al_p: dinner.ap},
  ];

  const rowsHTML = rows.map(r => `
    <div class="ing-row">
      <div class="ing-name" style="font-weight:700">${r.label}</div>
      <div class="ing-qty">
        ${r.mk_kcal > 0 ? `<span class="qty m">💙 ${r.mk_kcal} kcal · ${r.mk_p}g prot</span>` : ''}
        ${r.al_kcal > 0 ? `<span class="qty a">💗 ${r.al_kcal} kcal · ${r.al_p}g prot</span>` : ''}
      </div>
    </div>
    <div class="sep"></div>
  `).join('');

  document.getElementById('pickerOuter').style.display = 'none';

  document.getElementById('cardWrap').innerHTML = `
    <div class="hero-card" style="animation:cardIn .3s cubic-bezier(.2,0,.2,1)">
      <div class="meal-img-wrap" style="height:120px;background:linear-gradient(135deg,#1e293b,#334155)">
        <div class="meal-img-overlay"></div>
        <div class="meal-img-content">
          <div class="meal-tag">📊 Full Day</div>
          <div class="meal-title">${curDay} — Day Total</div>
        </div>
      </div>
      <div class="ing-section">
        <div class="ing-hd">Meal Breakdown</div>
        ${rowsHTML}
      </div>
      <div class="totals-bar">
        <div class="totals-title">Daily Totals</div>
        <div class="totals-grid">
          <div class="tot mk"><div class="tot-stripe"></div><div class="tot-val m">~${mk_total}</div><div class="tot-lbl">💙 Mark<br>kcal</div></div>
          <div class="tot al"><div class="tot-stripe"></div><div class="tot-val a">~${al_total}</div><div class="tot-lbl">💗 Allie<br>kcal</div></div>
          <div class="tot mk"><div class="tot-stripe"></div><div class="tot-val m">${mk_prot}g</div><div class="tot-lbl">💙 Mark<br>protein</div></div>
          <div class="tot al"><div class="tot-stripe"></div><div class="tot-val a">${al_prot}g</div><div class="tot-lbl">💗 Allie<br>protein</div></div>
        </div>
      </div>
    </div>
    <div class="fn">
      💙 Mark target: ~2,100–2,300 kcal · 160g+ protein<br>
      💗 Allie target: ~1,850–1,950 kcal · 115–120g protein ✦ Z
    </div>`;
}
